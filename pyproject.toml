[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
cache_dir = "TEMPORARY/pytest-cache"

[tool.ruff]
line-length = 100
target-version = "py310"
cache-dir = "TEMPORARY/ruff-cache"
exclude = [".venv", "TEMPORARY", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
